---
# Deploy-time only (manual run, not Packer) — places Phase 3b's discoverable
# artifacts: VM1c's cached VM6 credential, VM1d's mapped drive to VM3, VM1e's note
# revealing VM2's credential, and VM3's share content. (VM4's FUXA admin credential
# repoint is NOT here — it's automatic, via images/fuxa-hmi/assets/run.sh reading
# config/phase-3b/fuxa.env at CAVE's own postCommand time. See that image's README.md
# "Admin credential".)
#
#   ansible-playbook -i '<VM1c_IP>,<VM1d_IP>,<VM1e_IP>,<VM3_IP>,' deploy-artifacts.yml \
#     -e vm1c_ip=<VM1c_IP> -e vm1d_ip=<VM1d_IP> -e vm1e_ip=<VM1e_IP> -e vm3_ip=<VM3_IP> -e vm6_ip=<VM6_IP> \
#     -e ansible_user=caveadmin -e ansible_password='changeme' \
#     -c winrm -e ansible_winrm_transport=ntlm -e ansible_winrm_server_cert_validation=ignore \
#     -e ansible_port=5985 -e ansible_winrm_scheme=http

- name: VM1c — cache the Jump Host (VM6) credential
  hosts: "{{ vm1c_ip }}"
  gather_facts: no
  vars:
    vm6_user: "jump_operator"
    vm6_password: "oIDlQW2yVwocnyj2!"  # images/win-jump-host/playbook.yml
  tasks:
    - name: Wait until WinRM is available
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Cache the VM6 credential in Windows Credential Manager
      ansible.windows.win_shell: |
        cmdkey /generic:TERMSRV/{{ vm6_ip }} /user:{{ vm6_user }} /pass:"{{ vm6_password }}"

    - name: Stage a stored RDP connection shortcut referencing VM6
      ansible.windows.win_copy:
        dest: 'C:\Users\caveadmin\Desktop\JumpHost.rdp'
        content: |
          full address:s:{{ vm6_ip }}
          username:s:{{ vm6_user }}

- name: VM1d — persistent low-privilege mapped drive to VM3's share
  hosts: "{{ vm1d_ip }}"
  gather_facts: no
  vars:
    vm3_user: "fileserver_reader"
    vm3_password: "9Rz3ALCAFG43B77!"  # images/win-fileserver/playbook.yml
    share_unc: "\\\\{{ vm3_ip }}\\Shared"
  tasks:
    - name: Wait until WinRM is available
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Cache the fileserver_reader credential for the share's host
      ansible.windows.win_shell: |
        cmdkey /add:{{ vm3_ip }} /user:{{ vm3_user }} /pass:"{{ vm3_password }}"

    - name: Create the persistent mapped drive
      ansible.windows.win_shell: |
        net use Z: "{{ share_unc }}" /user:{{ vm3_user }} "{{ vm3_password }}" /persistent:yes

- name: VM1e — note revealing VM2's dedicated account
  hosts: "{{ vm1e_ip }}"
  gather_facts: no
  vars:
    vm2_user: "substation_engineer"
    vm2_password: "u8y63mo5iLUYNeOu#"  # images/win11-engineering-workstation/playbook.yml
  tasks:
    - name: Wait until WinRM is available
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Drop the note
      ansible.windows.win_copy:
        dest: 'C:\Users\caveadmin\Documents\engineering-workstation-login.txt'
        content: |
          Reminder to self —

          Engineering workstation login (for when DIGSI locks me out again):
          user: {{ vm2_user }}
          pass: {{ vm2_password }}

          Don't use the shared admin account on that box, IT keeps asking why it's logged
          in from two places at once.

- name: VM3 — place the semantic-gap documents on the share
  hosts: "{{ vm3_ip }}"
  gather_facts: no
  vars:
    share_path: "C:\\Shares\\Shared"
    # Credential this scenario's correspondence leaks: the FUXA/tag-DB (VM4) login.
    # (The VM6 jump-host credential is cached on VM1c, not in these documents.)
    handover_target: "OT/SCADA HMI (FUXA tag database)"
    handover_access_note: "through the jump host, then the engineering workstation (VM2)"
    handover_host: "10.1.2.10"
    handover_user: "admin"
    handover_password: "Eyta564EGS9iXDEcbD!"  # FUXA admin login, images/fuxa-hmi + win-domain-controller/VulnAD.ps1
  tasks:
    - name: Wait until WinRM is available
      ansible.builtin.wait_for_connection:
        timeout: 300

    # Only the share/ subtree is in-scenario content. The sibling Todo.md / README.md
    # (internal planning, name the real target) and correspondence-templates/ stay out.
    - name: Copy engineering-files content onto the share
      ansible.windows.win_copy:
        src: "../shared/engineering-files/share/"
        dest: "{{ share_path }}\\"

    # Render the credential-bearing handover email with this scenario's credential,
    # so the shared source stays secret-free and each scenario leaks the right login.
    - name: Render the remote-access handover correspondence
      ansible.windows.win_template:
        src: "../shared/engineering-files/correspondence-templates/2026-09-21 Remote access handover.txt.j2"
        dest: "{{ share_path }}\\Documents\\Ostfeld_7SJ82_2026\\Correspondence\\2026-09-21 Remote access handover.txt"

    # Fetched at deploy time, not committed — it's Siemens' copyrighted PDF, not ours to
    # redistribute in the repo. Confirmed reachable 2026-10-19 (HTTP 200, application/pdf).
    # This is the SIPROTEC 5 product catalog (covers the 7SJ82 among the family) — the
    # device-specific operating manual needs a support.industry.siemens.com entry ID that
    # has to be located by hand (portal search isn't automatable); swap the URL below once
    # that's found.
    - name: Fetch the Siemens SIPROTEC 5 catalog PDF (real vendor document, not fabricated)
      ansible.windows.win_get_url:
        url: "https://assets.new.siemens.com/siemens/assets/api/uuid:279cb01d-fd3b-4df4-8e04-f1fe98b81d6b/SIPROTEC-5-Catalog-EN.pdf"
        dest: "{{ share_path }}\\Documents\\Ostfeld_7SJ82_2026\\SIPROTEC-5-Catalog-EN.pdf"
      ignore_errors: yes  # cosmetic realism only — never block the deploy on an external fetch
