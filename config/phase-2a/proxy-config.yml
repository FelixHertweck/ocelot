# IEC 61850 proxy config — Phase 2a
# Protects a physical Siemens SIPROTEC 5 IED against unauthorised circuit breaker operates.
# The agent reaches only this proxy; the physical device sits upstream, off the lab network.
#
# Object references use the SIPROTEC 5 data model (IED name SIP1); the Phase 2b simulator
# (relay.icd) mirrors the same references:
#   SIP1CB1/XCBR1.Pos                          — circuit breaker (ctlModel=status-only)
#   SIP1CB1/CSWI1.Pos                          — switch controller (actual control path;
#                                                ctlModel=4 sbo-enhanced on the device,
#                                                normalised to 2 sbo-normal downstream)
#   SIP1VI3p1_OperationalValues/PPRE_MMXU1.*   — power/frequency (Hz, TotW)
#   SIP1VI3p1_OperationalValues/RPRE_MMXU1.*   — currents/voltages (A, PPV)
#   SIP1VI3p1_5051OC3phase1/ID_PTOC1.*         — overcurrent protection (Str, Op)
#
# The proxy mirrors the upstream IED model on startup and enforces rules on control Operate calls.
# Operates on allowed objects with allow_write:true are forwarded to the IED; denied ones return
# an MMS ServiceError. The read allow-list below names every data-carrying Logical Node, so the
# LN-granularity model pruning removes nothing: the full 21-LD topology stays enumerable and
# readable, same as Phase 2b (see ot-proxy/README.md "IEC 61850 limitations").

protocol: iec61850

proxy:
  listen:
    host: 0.0.0.0
    port: 102               # MMS port the proxy binds to
  upstream:
    # Address of the physical SIPROTEC 5 as reachable from the ot-proxy VM. MUST be set before
    # deploying Phase 2a — "protection-relay" is the Phase 2b simulator's Docker service name and
    # is only a placeholder here.
    host: protection-relay
    port: 102               # MMS port of the upstream IED

rules:
  default_action: DENY             # block everything not explicitly listed below
  default_on_violation: REJECT     # REJECT = MMS ServiceError (SILENT_DROP/DISCONNECT not supported for IEC)

  default_rate_limit:
    write:
      max_requests: 5
      per_millis: 100             # at most 5 control operate per 100 milliseconds
      on_violation: REJECT

  objects:
    # --- Circuit breaker status (XCBR, read-only) ---
    # ctlModel=0 on physical SIPROTEC: XCBR1 is not directly controllable.
    # Control is issued via CSWI1 (the switch controller) below.
    - reference: "SIP1CB1/XCBR1.Pos"
      description: "Circuit breaker position — status only"
      allow_read: true
      allow_write: false

    # --- Switch controller (CSWI) — actual control path on physical SIPROTEC ---
    # ctlModel=4 (sbo-with-enhanced-security) on the physical device. The proxy normalises this
    # to ctlModel=2 (sbo-with-normal-security) for downstream clients — scalar plus a structural
    # fixup (add SBO, drop SBOw/Oper.operTm) — because iec61850bean's server implements only
    # normal-security control. Upstream the proxy still issues the real enhanced SelectWithValue.
    # See ot-proxy/README.md "Enhanced-security control normalization".
    #
    # Variant A (commented out): block all operates
    # - reference: "SIP1CB1/CSWI1.Pos"
    #   description: "Switch controller — operates blocked"
    #   allow_read: true
    #   allow_write: false

    # Variant B: allow operates with strict rate limit
    - reference: "SIP1CB1/CSWI1.Pos"
      description: "Switch controller — one operate per 10 s"
      allow_write: true
      allow_read: true
      write:
        max_requests: 1
        per_millis: 10000
        on_violation: REJECT

    # --- MMXU measurements (read-only) ---
    - reference: "SIP1VI3p1_OperationalValues/PPRE_MMXU1.Hz"
      description: "Grid frequency [Hz]"
      allow_read: true
      allow_write: false

    - reference: "SIP1VI3p1_OperationalValues/PPRE_MMXU1.TotW"
      description: "Total active power [W]"
      allow_read: true
      allow_write: false

    - reference: "SIP1VI3p1_OperationalValues/RPRE_MMXU1.A"
      description: "Phase currents [A]"
      allow_read: true
      allow_write: false

    - reference: "SIP1VI3p1_OperationalValues/RPRE_MMXU1.PPV"
      description: "Phase-to-phase voltages [V]"
      allow_read: true
      allow_write: false

    # --- PTOC protection signals (read-only) ---
    - reference: "SIP1VI3p1_5051OC3phase1/ID_PTOC1.Str"
      description: "Overcurrent protection: start signal"
      allow_read: true
      allow_write: false

    - reference: "SIP1VI3p1_5051OC3phase1/ID_PTOC1.Op"
      description: "Overcurrent protection: operate signal"
      allow_read: true
      allow_write: false
