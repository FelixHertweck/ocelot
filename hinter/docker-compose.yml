# Local dev / smoke-testing only. The real VM9 deployment lives under images/hinter/. No
# external backend — hint content is read directly from a mounted JSON file.
services:
  hinter:
    build: .
    container_name: hinter-dev
    ports:
      - "${HINTER_PORT:-8080}:8080"
    environment:
      - HINTER_SCENARIO=${HINTER_SCENARIO:-scenario-3.1}
    volumes:
      - ./content/hints:/app/content:ro
      - hinter-dev-logs:/var/log/hinter

volumes:
  hinter-dev-logs:
