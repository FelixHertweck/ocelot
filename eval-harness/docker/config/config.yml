# OCELOT Eval-Harness — Run Configuration
#
# To use a different config: CONFIG=this-file.yml docker compose run --rm eval
# Multiple config files can coexist in this directory.

# ── Required ──────────────────────────────────────────────────────────────────

scenario:
  cave_config_name: example              # .json5 basename, resolved by deploy-wrapper.sh
  configs_subpath: backend/configs/example  # scenario's own dir — where eval.sh/reset.sh live

prompts:
  source: example.md  # relative to /app/config/prompts/, or use absolute path

evaluation:
  llm:
    api_key: <LLM_API_KEY>
    base_url: <LLM_BASE_URL>
    model: <LLM_MODEL>

# ── Optional (uncomment to override defaults) ─────────────────────────────────

# scenario:
#   cave_wrapper_dir: /abs/path              # default: $CAVE_WRAPPER_DIR (set in .env); only override to point elsewhere

# deploy:
#   wait_time: 600                           # default: 600s
#   lab_prefix: auto                         # default: auto → <scenario>-<HHMM>
#   public_vpn_port: auto                    # default: auto → first free from pool
#   port_pool: "51820-51920"                 # default: 51820-51920

# openhands:
#   base_url: http://10.1.1.20:3000          # default: http://10.1.1.20:3000
#   initial_wait: 15                         # default: 15s, wait before the first status poll after starting a prompt
#   poll_interval: 15                        # default: 15s, wait between subsequent status polls
#   run_timeout: 3600                        # default: 3600s (1h)

# prompts:
#   mode: cumulative                         # default: cumulative (alternative: adaptive) — switches instrument, drives ORACLE_ENABLED
#                                             # adaptive also needs oracle.base_url + a cave_config_name that deploys the Oracle VM

# runs:
#   count: 1                                 # default: 1. If >1, the full prompt sweep is repeated N times
#                                             # (no redeploy between runs, just cleanup_script). Results are
#                                             # kept fully separate under run1/, run2/, ... and combined into
#                                             # a top-level evaluation.md at the end.

# oracle:
#   base_url: http://10.1.1.21:8080          # required when prompts.mode is adaptive (fails fast at startup if unset) — Oracle's REST base URL, reachable from the harness the same way as openhands.base_url

# context_script:
#   cmd: "bash eval.sh"                      # default: bash eval.sh in config_dir

# cleanup_script:
#   cmd: "bash reset.sh"                     # default: bash reset.sh in config_dir

# evaluation:
#   extraction_prompt: /app/config/extraction-prompt.md   # default: built-in (src/prompts/extraction.md)
#   synthesis_prompt: /app/config/synthesis-prompt.md     # default: built-in (src/prompts/synthesis.md)
#   template: /app/config/evaluation-template.md          # default: built-in (src/prompts/template.md)
