# OCELOT Eval-Harness — Run Configuration
#
# To use a different config: CONFIG=this-file.yml docker compose run --rm eval
# Multiple config files can coexist in this directory.

# ── Required ──────────────────────────────────────────────────────────────────

scenario:
  cave_config_name: example              # .json5 basename, resolved by deploy-wrapper.sh
  configs_subpath: backend/configs/example  # scenario's own dir — where eval.sh/reset.sh live

prompts:
  source: example.md  # relative to /app/config/prompts/, or use absolute path

evaluation:
  llm:
    api_key: <LLM_API_KEY>
    base_url: <LLM_BASE_URL>
    model: <LLM_MODEL>

# ── Optional (uncomment to override defaults) ─────────────────────────────────

# scenario:
#   cave_wrapper_dir: /abs/path              # default: $CAVE_WRAPPER_DIR (set in .env); only override to point elsewhere

# deploy:
#   wait_time: 600                           # default: 600s
#   lab_prefix: auto                         # default: auto → <scenario>-<HHMM>
#   public_vpn_port: auto                    # default: auto → first free from pool
#   port_pool: "51820-51920"                 # default: 51820-51920

# agent:
#   backend: openhands                       # default: openhands — the tool that runs the agent (see src/lib/agent_backend.py).
#                                            # Its own settings live in the block of the same name below.

# openhands:                                 # settings of the OpenHands backend only
#   base_url: http://10.1.1.20:3000          # default: http://10.1.1.20:3000
#   initial_wait: 15                         # default: 15s, let a fresh conversation's status settle before the first check

# limits:                                    # harness-side supervision of the agent session, independent of the backend
#   run_timeout: 3600                        # default: 7200s. Per prompt, cumulative over goal-feedback rounds.
#   check_interval: 15                       # default: 15s. How often the harness polls status and token usage.
#                                            # Bounds how far max_tokens can be overshot.
#   max_continues: 2                         # default: 2 — "continue" messages sent when the agent ends with error/stuck; 0 disables recovery
#   max_tokens: 0                            # default: 0 (no limit). Stop the session once accumulated prompt+completion
#                                            # tokens reach this (logged, final_status token_limit); scored like a timeout, not an
#                                            # error. Also the budget for goal_feedback: counts over all feedback rounds.

# goal_feedback:                             # harness-side loop: keep the agent working until the scenario's one end goal is met
#   enabled: false                           # default: false. When true, after the agent stops the harness runs the context
#                                            # script, reads its goals.json ({"achieved": bool}), and if unmet sends ONE fixed,
#                                            # neutral "keep going" message and waits again. Never names the goal — the agent
#                                            # has no notion of "sub-goals" at all (that naming would be a hint).
#   max_rounds: 0                            # default: 0 = unlimited — repeat until the goal is met or limits.max_tokens /
#                                            # run_timeout ends the session. >0 caps the number of feedback messages.
#                                            # With max_rounds 0, limits.max_tokens >= 1 is required (fails fast otherwise).
#   message: "Not all objectives have been achieved yet. Please continue working on the task."
#                                            # needs a scenario context script that writes OCELOT_GOALS_FILE (e.g. phase-2a)

# prompts:
#   mode: cumulative                         # default: cumulative — name of the instrument (see src/instruments/; e.g. adaptive)
#                                             # adaptive also needs oracle.base_url + a cave_config_name that deploys the Oracle VM

# runs:
#   count: 1                                 # default: 1. If >1, the full prompt sweep is repeated N times
#                                             # (no redeploy between runs, just cleanup_script). Results are
#                                             # kept fully separate under run1/, run2/, ... and combined into
#                                             # a top-level evaluation.md at the end.

# oracle:
#   base_url: http://10.1.1.21:8080          # required when prompts.mode is adaptive (fails fast at startup if unset) — Oracle's REST base URL, reachable from the harness the same way as openhands.base_url

# context_script:
#   cmd: "bash eval.sh"                      # default: bash eval.sh in config_dir

# cleanup_script:
#   cmd: "bash reset.sh"                     # default: bash reset.sh in config_dir

# evaluation:
#   extraction_prompt: /app/config/extraction-prompt.md   # default: built-in (src/prompts/extraction.md)
#   synthesis_prompt: /app/config/synthesis-prompt.md     # default: built-in (src/prompts/synthesis.md)
#   template: /app/config/evaluation-template.md          # default: built-in (src/prompts/template.md)
