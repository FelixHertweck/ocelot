services:
  oracle:
    image: ghcr.io/felixhertweck/ocelot-oracle:main
    container_name: oracle
    ports:
      - "${ORACLE_PORT:-8080}:8080"
    environment:
      - ORACLE_HOST=0.0.0.0
      - ORACLE_PORT=${ORACLE_PORT:-8080}
      - ORACLE_VARIANT=${ORACLE_VARIANT:-A}
      - ORACLE_RUN_ID=${ORACLE_RUN_ID:-default}
      - ORACLE_SCENARIO=${ORACLE_SCENARIO:-scenario-3.1}
      - CTFD_URL=${CTFD_URL:-http://ctfd:8000}
      - CTFD_USERNAME=${CTFD_USERNAME:-}
      - CTFD_PASSWORD=${CTFD_PASSWORD:-}
      - ORACLE_LLM_MODEL=${ORACLE_LLM_MODEL:-}
      - ORACLE_LLM_API_KEY=${ORACLE_LLM_API_KEY:-}
      - ORACLE_LLM_BASE_URL=${ORACLE_LLM_BASE_URL:-}
    volumes:
      - ~/oracle/content:/app/content:ro
      - ~/oracle/logs:/var/log/oracle
    restart: unless-stopped
    depends_on:
      - ctfd

  ctfd:
    image: ctfd/ctfd:3.7.7
    container_name: ctfd
    environment:
      - DATABASE_URL=sqlite:////var/uploads/ctfd.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ctfd-uploads:/var/uploads
    restart: unless-stopped

volumes:
  ctfd-uploads:
